version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use the Node version pinned in .nvmrc. Node 26 can't run on the
        # Amplify build image (it needs libatomic, and the build isn't root),
        # so .nvmrc pins Node 24.
        - nvm install --skip-default-packages && nvm use
        - node -v
        - npm -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
